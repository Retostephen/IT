{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
    <h1>Registration</h1>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <label>{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
                <div class="error">{{ field.errors }}</div>
            {% endif %}
        {% endfor %}
        <button type="submit">Register</button>
    </form>
{% endblock %}
