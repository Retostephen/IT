{% extends "base.html" %}
{% block title %}Delete Student{% endblock %}
{% block content %}
<div class="card shadow-sm border-danger">
    <div class="card-body">
        <h3 class="card-title text-danger">Delete Student</h3>
        <p>Are you sure you want to delete <strong>{{ student.full_name }}</strong>? This cannot be undone.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
            <a href="{% url 'dashboard' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
